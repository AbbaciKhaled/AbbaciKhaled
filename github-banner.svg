  <circle cx="504" cy="37"  r="5" fill="#61DAFB"/>
  <text x="516" y="42"  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">React / Next.js</text>

  <rect x="488" y="76"  width="162" height="30" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#sh)"/>
  <circle cx="504" cy="91"  r="5" fill="#539E43"/>
  <text x="516" y="96"  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">Node.js</text>

  <rect x="488" y="130" width="162" height="30" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#sh)"/>
  <circle cx="504" cy="145" r="5" fill="#875A7B"/>
  <text x="516" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">Odoo ERP</text>

