
<svg viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(37,99,235,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="scalableGrad" x1="170" y1="0" x2="355" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="sepGrad" x1="0" y1="0" x2="0" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%"   stop-color="#2563EB" stop-opacity="0"/>
      <stop offset="25%"  stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="75%"  stop-color="#2563EB" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#2563EB" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="blobBlue">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobOrange">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0"/>
    </radialGradient>
    <filter id="sh" x="-20%" y="-60%" width="140%" height="220%">
      <feDropShadow dx="0" dy="1" stdDeviation="2.5" flood-color="#0f172a" flood-opacity="0.07"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="860" height="310" fill="#ffffff" rx="12"/>
  <rect width="860" height="310" fill="url(#grid)" rx="12"/>

  <!-- Ambient blobs -->
  <ellipse cx="780" cy="-20" rx="320" ry="280" fill="url(#blobBlue)"/>
  <ellipse cx="90"  cy="360" rx="260" ry="210" fill="url(#blobOrange)"/>
  <ellipse cx="700" cy="330" rx="200" ry="150" fill="url(#blobBlue)" opacity="0.4"/>

  <!-- Separator -->
  <line x1="476" y1="0" x2="476" y2="310" stroke="url(#sepGrad)" stroke-width="1"/>

  <!-- ══ LEFT ══ -->

  <!-- Available badge -->
  <rect x="28" y="26" width="180" height="26" rx="13" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sh)"/>
  <circle cx="46" cy="39" r="6" fill="#22c55e" opacity="0.18"/>
  <circle cx="46" cy="39" r="3.5" fill="#22c55e"/>
  <text x="58" y="44" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">Available for projects</text>

  <!-- Headline -->
  <text x="28" y="103" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-0.025em">Hi, I&#8217;m Khaled.</text>
  <text x="28" y="150" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="800" letter-spacing="-0.025em"><tspan fill="#0f172a">I build </tspan><tspan fill="url(#scalableGrad)">scalable</tspan></text>
  <text x="28" y="197" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="38" font-weight="800" fill="#0f172a" letter-spacing="-0.025em">business software<tspan fill="#F97316">.</tspan></text>

  <!-- Subtext & divider -->
  <text x="28" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#64748b" letter-spacing="0.01em">Software Engineer · Full Stack Developer</text>
  <text x="28" y="236" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="12.5" fill="#64748b" letter-spacing="0.01em">Functional Analyst · PhD Candidate</text>
  <rect x="28" y="251" width="180" height="3.5" rx="2" fill="url(#divGrad)"/>

  <!-- Stats -->
  <text x="28"  y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#2563EB">6+</text>
  <text x="53"  y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9"   font-weight="700" fill="#94a3b8" letter-spacing="0.1em"> YRS EXP</text>
  <circle cx="119" cy="273" r="2" fill="#e2e8f0"/>
  <text x="127" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="17" font-weight="800" fill="#2563EB">50+</text>
  <text x="159" y="277" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="9"   font-weight="700" fill="#94a3b8" letter-spacing="0.1em"> PROJECTS</text>

