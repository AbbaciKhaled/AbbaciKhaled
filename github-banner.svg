
<svg viewBox="0 0 860 310" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(37,99,235,0.05)" stroke-width="1"/>
    </pattern>
    <linearGradient id="scalableGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="divGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <radialGradient id="blobBlue">
      <stop offset="0%" stop-color="#dbeafe" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#dbeafe" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobOrange">
      <stop offset="0%" stop-color="#ffedd5" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ffedd5" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="860" height="310" fill="#ffffff" rx="12"/>
  <rect width="860" height="310" fill="url(#grid)" rx="12"/>
  <ellipse cx="820" cy="-30"  rx="340" ry="300" fill="url(#blobBlue)"/>
  <ellipse cx="80"  cy="360"  rx="280" ry="230" fill="url(#blobOrange)"/>
  <ellipse cx="680" cy="340"  rx="220" ry="180" fill="url(#blobBlue)" opacity="0.35"/>

  <!-- Titre — 2 lignes centrées -->
  <text x="430" y="90" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="800" fill="#0f172a" letter-spacing="-0.025em">Hi, I&#8217;m Khaled.</text>
  <text x="430" y="142" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="40" font-weight="800" letter-spacing="-0.025em"><tspan fill="#0f172a">I build </tspan><tspan fill="url(#scalableGrad)">scalable</tspan><tspan fill="#0f172a"> business software</tspan></text>

  <!-- Divider -->
  <rect x="320" y="164" width="220" height="3.5" rx="2" fill="url(#divGrad)"/>

  <!-- Sous-titres — chacun sur sa ligne -->
  <text x="430" y="188" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b" letter-spacing="0.01em">Software Engineer</text>
  <text x="430" y="206" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b" letter-spacing="0.01em">Full Stack Developer</text>
  <text x="430" y="224" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b" letter-spacing="0.01em">Functional Analyst</text>
  <text x="430" y="242" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="13.5" fill="#64748b" letter-spacing="0.01em">PhD Candidate</text>
</svg>
