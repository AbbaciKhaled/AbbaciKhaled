  <rect x="666" y="48"  width="162" height="30" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#sh)"/>
  <circle cx="682" cy="63"  r="5" fill="#3178C6"/>
  <text x="694" y="68"  font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">TypeScript</text>

  <rect x="666" y="102" width="162" height="30" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#sh)"/>
  <circle cx="682" cy="117" r="5" fill="#3776AB"/>
  <text x="694" y="122" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">Python</text>

  <rect x="666" y="156" width="162" height="30" rx="8" fill="white" stroke="#e2e8f0" stroke-width="1.2" filter="url(#sh)"/>
  <circle cx="682" cy="171" r="5" fill="#7c3aed"/>
  <text x="694" y="176" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif" font-size="11.5" font-weight="600" fill="#334155">AI Agents</text>
